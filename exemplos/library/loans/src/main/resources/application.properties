# Porta usada pela aplicação em modo dev/produção. Deve bater com
# LOAN_URL usado em CatalogTest/LoansTest (http://localhost:9081).
quarkus.http.port=9081

# Porta usada quando os testes @QuarkusTest sobem sua própria instância da
# aplicação (ex.: LoansResourceTest). Precisa ser diferente da porta acima
# (já em uso pelo `quarkus:dev`) e diferente das portas do serviço "catalog".
quarkus.http.test-port=9083
